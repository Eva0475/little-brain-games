<style>
:root{--bg:#f7f9f4;--card:#fffdf6;--green:#a7c957;--pale:#ddecc8;--ink:#344b3b;--line:#d8e4ce;--orange:#f6a623;--deep:#2f5a33}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 8px 24px rgba(52,75,59,.08)}
.tag{display:inline-block;background:var(--pale);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
h1{margin:14px 0 4px;font-size:28px;color:var(--deep)}
p{margin:6px 0;line-height:1.45;font-size:15px}
.small{font-size:13px;color:#5c6f60}
label{display:block;text-align:left;font-weight:700;margin:20px 0 6px;font-size:14px}
input{width:100%;font:inherit;font-size:20px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--green);border-color:var(--green)}
button{margin-top:14px;width:100%;font:inherit;font-weight:800;font-size:18px;padding:14px;border:0;border-radius:14px;background:var(--green);color:#22361f;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:22px;margin-top:12px;font-weight:600;font-size:14px}
.err{color:#b4441c}
</style>
</head>

const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(DATA)));
  try{localStorage.setItem(KEY,norm(code))}catch(e){}
  document.open();document.write(html);document.close();
}
